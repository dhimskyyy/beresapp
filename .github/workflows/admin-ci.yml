name: Web Admin CI

on:
  push:
    branches: [ main ]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Admin Dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Admin (Vite + Tailwind)
        run: npm run build
